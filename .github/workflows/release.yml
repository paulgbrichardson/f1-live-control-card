name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            f1-live-control-card.js
            f1-live-control-card.min.js
            dist/f1-live-control-card.js
            dist/f1-live-control-card.min.js
          generate_release_notes: true
